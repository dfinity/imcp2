# Continuous integration: build and test the Rust crate on every pull request
# and every push to main, so regressions are caught before merge. This is where
# the read-only-delegation e2e test
# (`identities::tests::read_only_delegation_scopes_signed_requests_end_to_end`)
# and the rest of the `cargo test` suite run in CI, alongside the canister
# tools' PocketIC end-to-end suite in its own job below, the rustfmt check,
# and the internal-identifier scan — the deploy workflow only runs the
# status-dashboard's npm tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # Third-party actions are pinned to a commit SHA (supply-chain hardening);
      # the trailing comment records the human-readable version.
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Use the runner's pre-installed rustup to pull a current stable toolchain,
      # avoiding an extra (unpinned) third-party action.
      - name: Install stable Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustc --version && cargo --version

      # `--locked` fails if Cargo.lock is out of date, so CI also guards the
      # dependency pins (e.g. ic-agent / ic-transport-types) from silent drift.
      - name: Build
        run: cargo build --locked --workspace --all-targets

      - name: Test
        run: cargo test --locked --workspace --all-targets

  # Formatting, enforced rather than merely requested: CONTRIBUTING.md asks for
  # `cargo fmt --all` and the coding guidelines ask for an rustfmt-clean tree,
  # and this is what keeps that true. Without it the tree drifts out of shape
  # silently, and the next contributor to run the documented step gets a
  # whole-repo reformat in their diff — which is exactly how `rustfmt.toml` came
  # to be missing for this long.
  #
  # Its own job, not a step in `test`: a formatting nit should not hide the test
  # results, nor a compile error the formatting. It compiles nothing, so it
  # finishes in seconds and adds no wall-clock to the run.
  fmt:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # As in the other jobs: the runner's rustup, no third-party action. Note
      # that this tracks rolling `stable`, so a release that changes rustfmt's
      # output can turn this red with no code change; the fix is then to re-run
      # `cargo fmt --all` and commit, not to pin.
      - name: Install stable Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustup component add rustfmt
          cargo fmt --version

      # `--check` reports the drift and fails; it never rewrites the tree.
      # Reproduce locally with `cargo fmt --all`, which CONTRIBUTING.md asks for.
      - name: Check formatting
        run: cargo fmt --all -- --check

  # The canister tools' end-to-end suite: real canisters on a real replica in
  # PocketIC, driven over a real MCP session. Its own job because it needs the
  # PocketIC server binary — which cargo does not fetch, and without which the
  # suite skips itself — and because compiling `pocket-ic` would otherwise slow
  # the main build down for every change. The Internet Identity handshake suite
  # (`src/e2e_handshake.rs`) is NOT run here: it additionally needs an II
  # release wasm, which this workflow has no supported way to pin.
  e2e:
    name: End-to-end (PocketIC)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install stable Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustc --version && cargo --version

      # Pinned to a server version the `pocket-ic` crate accepts (>= 15, < 16)
      # AND to that download's digest: a test suite is only worth as much as the
      # replica it runs against, so the binary is verified rather than trusted.
      - name: Fetch the PocketIC server
        run: |
          curl -fsSL -o pocket-ic.gz \
            https://github.com/dfinity/pocketic/releases/download/15.0.0/pocket-ic-x86_64-linux.gz
          echo "972d592975bdd0f046b05b5414ed6f9a044c676ef912b8ac81d359dd4982b038  pocket-ic.gz" \
            | sha256sum --check --strict
          gunzip pocket-ic.gz
          chmod +x pocket-ic

      # POCKET_IC_BIN is what stops the suite from skipping itself, so a failure
      # to provide it fails this job loudly rather than passing empty.
      - name: Test
        run: |
          POCKET_IC_BIN="$PWD/pocket-ic" \
            cargo test --locked -p imcp2-core --features e2e e2e_canister_tools -- --nocapture

  # Block new internal network identifiers from entering the repository. Secret
  # scanning and push protection already cover credentials; this covers the
  # class they cannot know about — private addresses and cloud resource ids —
  # and it reads commit messages as well as the diff, because the disclosure
  # that prompted it was in a commit message rather than in a file.
  #
  # Pull requests only: `main` is protected and reachable solely through a pull
  # request, so this is the point where a change can still be stopped.
  scan:
    name: Scan for internal identifiers
    # Needed as well as the comment above: this workflow also runs on pushes to
    # main, where the pull_request context is empty and the range below would
    # collapse to an invalid "...HEAD". No `needs:`, so a bare condition here
    # carries no implicit success() over an upstream job.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history: the commit-message scan walks the pull request's
          # commits, and the default shallow clone would leave it with nothing
          # to read — passing silently rather than failing loudly.
          fetch-depth: 0
          # Check out the real head rather than the synthetic merge commit, so
          # the scanned range is exactly the pull request's own commits.
          ref: ${{ github.event.pull_request.head.sha }}

      # Guard the guard: a scanner that never fires looks identical to a
      # passing build, so its own tests run here too.
      - name: Test the scanner
        run: bash .github/scripts/scan-internal-identifiers.test.sh

      - name: Scan
        run: |
          bash .github/scripts/scan-internal-identifiers.sh \
            "${{ github.event.pull_request.base.sha }}...HEAD"
