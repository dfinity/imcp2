# Continuous integration: build and test the Rust crate on every pull request
# and every push to main, so regressions are caught before merge. This is where
# the read-only-delegation e2e test
# (`identities::tests::read_only_delegation_scopes_signed_requests_end_to_end`)
# and the rest of the `cargo test` suite run in CI — the deploy workflow only
# runs the status-dashboard's npm tests.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      # Third-party actions are pinned to a commit SHA (supply-chain hardening);
      # the trailing comment records the human-readable version.
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      # Use the runner's pre-installed rustup to pull a current stable toolchain,
      # avoiding an extra (unpinned) third-party action.
      - name: Install stable Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustc --version && cargo --version

      # `--locked` fails if Cargo.lock is out of date, so CI also guards the
      # dependency pins (e.g. ic-agent / ic-transport-types) from silent drift.
      - name: Build
        run: cargo build --locked --all-targets

      - name: Test
        run: cargo test --locked --all-targets
