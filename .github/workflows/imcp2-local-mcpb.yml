# Builds the Claude Desktop bundle (`imcp2-local.mcpb`) for an
# `imcp2-local-v*` release, attests it, and attaches it to that release.
#
# Hung off `post-announce-jobs` in dist-workspace.toml: dist has no notion of
# an MCPB artifact, and the bundle needs the finished per-platform archives
# anyway, so it is assembled after the release exists — from that release's
# own published archives, each checked against its .sha256 and its
# attestation (see .github/scripts/build-mcpb.sh, which also says why the
# macOS binary is universal).
#
# Two jobs, split by privilege. `build` runs code this repository didn't
# write (the mcpb CLI and its npm dependencies) and the release's own binary,
# so it gets a read-only token and no OIDC: nothing it runs can edit the
# release, or mint a token and sign as this workflow, whatever it reads from
# its environment. `publish` holds those rights and runs nothing but pinned
# actions and `gh`. The bundle is a new artifact with its own digest, so it
# gets its own provenance attestation rather than leaning on the archives'.
# The caller grants the union of both jobs' permissions through
# `github-custom-job-permissions`; each job takes only its share.
name: imcp2-local Claude Desktop bundle

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  build:
    # macOS for the native `lipo`, and to execute the universal binary it
    # just built, which is how the manifest's tool list is read off the server.
    runs-on: macos-15
    permissions:
      contents: read
      attestations: read
    env:
      PLAN: ${{ inputs.plan }}
      # Read-only here: it only verifies the input archives' attestations.
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      # Pinned to a commit SHA, as every other action in this pipeline is.
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - name: Build the bundle from this release's archives
        shell: bash
        run: |
          set -euo pipefail
          tag="$(printf '%s' "$PLAN" | jq -er '.announcement_tag')"
          .github/scripts/build-mcpb.sh "$tag" mcpb-out

      - name: Hand the bundle to the publish job
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: imcp2-local-mcpb
          path: mcpb-out/imcp2-local.mcpb
          if-no-files-found: error
          # A re-run of this job replaces its earlier upload.
          overwrite: true

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      PLAN: ${{ inputs.plan }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch the bundle
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: imcp2-local-mcpb
          path: mcpb-out

      - name: Attest
        uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f
        with:
          subject-path: mcpb-out/imcp2-local.mcpb

      - name: Attach to the release
        shell: bash
        run: |
          set -euo pipefail
          tag="$(printf '%s' "$PLAN" | jq -er '.announcement_tag')"
          # --clobber so a re-run replaces the asset rather than failing on it.
          gh release upload "$tag" mcpb-out/imcp2-local.mcpb \
            --repo "$GITHUB_REPOSITORY" --clobber
