# Deploy a tagged release to production.
#
# Every `release-*` tag pushed to this repository is rolled out to the production
# host. Nothing else deploys here — production only ever moves when someone cuts a
# tag, so the deployed revision is always a named, reproducible point in history.
#
# Cutting a release:
#   git tag release-2026-07-27 <commit>   # any suffix; the prefix is what matters
#   git push origin release-2026-07-27
#
# Rolling back: re-run this workflow from the Actions tab with the previous tag as
# the `ref` input. That rebuilds and ships that exact commit — no revert commit and
# no new tag needed.
#
# Required REPOSITORY secrets (Settings -> Secrets and variables -> Actions). A job
# calling a reusable workflow with `uses:` cannot declare an `environment:`, so the
# secrets passed below resolve at repository and organization scope only — naming an
# environment-scoped secret here gets an empty value.
#
# The converse is NOT true, and it is the trap: deploy-native.yml's ship job does set
# `environment:`, so a secret defined on the `production` environment resolves there
# and OVERRIDES whatever this caller passed in. Define each secret in exactly one
# place; defining it in both means the environment copy silently wins. The
# `production` environment's protection rules apply either way.
#   PROD_DEPLOY_SSH_KEY     private SSH key for the sudo-capable user on the host
#   PROD_DEPLOY_HOST        user@host, e.g. ec2-user@10.118.0.61
#   PROD_DEPLOY_DOMAIN      public FQDN served over HTTPS
#   PROD_DEPLOY_ACME_EMAIL  email for Let's Encrypt / ACME
# Optional:
#   PROD_DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan <host>`; pin it to avoid TOFU.
name: Deploy release

on:
  push:
    tags: ['release-*']
  # Manual re-run, and the rollback path: pass an earlier release tag as `ref`.
  workflow_dispatch:
    inputs:
      ref:
        description: 'Tag (or commit) to deploy, e.g. release-2026-07-27'
        required: true
        type: string

# Never run two production deploys at once; let an in-flight deploy finish rather
# than cancel it half-way through replacing the binary on the host.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # A `release-*` tag push is constrained by the trigger. workflow_dispatch is not:
  # its `ref` is free text, so `main` would deploy whatever that branch points at
  # right now — the exact property this workflow exists to prevent. Accept only refs
  # that cannot move: a release-* tag, or a full 40-character commit SHA for the case
  # where the commit to roll back to never had a tag cut for it.
  validate-ref:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Reject refs that can move
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          if [ "${REF#release-}" != "$REF" ] || printf '%s' "$REF" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "ref '$REF' cannot move; proceeding."
          else
            echo "::error::Refusing to deploy '$REF' to production: it is neither a release-* tag nor a full 40-character commit SHA. Branches and abbreviated SHAs can move or become ambiguous, so the deployed revision would not be reproducible. Cut a release-* tag, or pass the full commit SHA."
            exit 1
          fi

  deploy:
    needs: validate-ref
    # validate-ref is skipped on a tag push, and a skipped dependency would skip this
    # job too under the default `success()` gate. Gate on "nothing failed" instead, so
    # tag pushes proceed while a rejected dispatch ref still stops the deploy.
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/deploy-native.yml
    with:
      environment: production
      # The production host is on a private network (RFC1918 v4), so a
      # GitHub-hosted runner cannot reach it. Ship from the on-prem runner, which
      # is inside that network. Its arch is irrelevant — the ship job only runs
      # ssh/tar, never the binary itself.
      # `imcp-prod` must be a label unique to the on-prem production runner, and has
      # to be added there before a release tag will deploy anything. `self-hosted`
      # and `linux` are applied automatically to every Linux self-hosted runner, so
      # those two alone select *any* of them — handing an arbitrary machine the
      # production SSH key and reachability into that network. Requiring a label
      # that may not exist yet makes the job queue instead, which is the safe
      # direction to fail for production.
      ship_runs_on: '["self-hosted","linux","imcp-prod"]'
      # arm64, matching staging. Parity matters here: aws-lc-sys/ring carry
      # per-arch assembly, so a differing production arch would leave the crypto
      # paths this server's auth depends on unexercised by staging.
      arch: arm64
      build_runs_on: '"ubuntu-24.04-arm"'
      ref: ${{ inputs.ref || github.ref }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
      DEPLOY_DOMAIN: ${{ secrets.PROD_DEPLOY_DOMAIN }}
      DEPLOY_ACME_EMAIL: ${{ secrets.PROD_DEPLOY_ACME_EMAIL }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.PROD_DEPLOY_KNOWN_HOSTS }}
