# Deploy a tagged release to production.
#
# Every `release-*` tag pushed to this repository is rolled out to the production
# host. Nothing else deploys here — production only ever moves when someone cuts a
# tag, so the deployed revision is always a named, reproducible point in history.
#
# Cutting a release:
#   git tag release-2026-07-27 <commit>   # any suffix; the prefix is what matters
#   git push origin release-2026-07-27
#
# Rolling back: re-run this workflow from the Actions tab with the previous tag as
# the `ref` input. That rebuilds and ships that exact commit — no revert commit and
# no new tag needed.
#
# Required REPOSITORY secrets (Settings -> Secrets and variables -> Actions). A job
# calling a reusable workflow with `uses:` cannot declare an `environment:`, so the
# secrets passed below resolve at repository and organization scope only — naming an
# environment-scoped secret here gets an empty value.
#
# The converse is NOT true, and it is the trap: deploy-native.yml's ship job does set
# `environment:`, so a secret defined on the `production` environment resolves there
# and OVERRIDES whatever this caller passed in. Define each secret in exactly one
# place; defining it in both means the environment copy silently wins. The
# `production` environment's protection rules apply either way.
#   PROD_DEPLOY_SSH_KEY     private SSH key for the sudo-capable user on the host
#   PROD_DEPLOY_HOST        user@host, e.g. ec2-user@10.118.0.61
#   PROD_DEPLOY_DOMAIN      public FQDN served over HTTPS
#   PROD_DEPLOY_ACME_EMAIL  email for Let's Encrypt / ACME
# Optional:
#   PROD_DEPLOY_KNOWN_HOSTS  output of `ssh-keyscan <host>`; pin it to avoid TOFU.
name: Deploy release

on:
  push:
    tags: ['release-*']
  # Manual re-run, and the rollback path: pass an earlier release tag as `ref`.
  workflow_dispatch:
    inputs:
      ref:
        description: >-
          release-* tag (e.g. release-2026-07-27, or the fully-qualified
          refs/tags/release-2026-07-27), or a full 40-character commit SHA.
        required: true
        type: string

# Never run two production deploys at once; let an in-flight deploy finish rather
# than cancel it half-way through replacing the binary on the host.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # A `release-*` tag push is constrained by the trigger. workflow_dispatch is not:
  # its `ref` is free text, so `main` would deploy whatever that branch points at
  # right now — the exact property this workflow exists to prevent. Accept only refs
  # that cannot move: a release-* tag, or a full 40-character commit SHA for the case
  # where the commit to roll back to never had a tag cut for it.
  validate-ref:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      # The accepted ref in unambiguous form, consumed by deploy below. Empty when
      # this job is skipped (tag push), which is what the fallback there handles.
      ref: ${{ steps.normalize.outputs.ref }}
    steps:
      - name: Reject refs that can move
        id: normalize
        env:
          REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail

          # Constrain the entire input to one line of refname characters BEFORE
          # looking at its shape. This step writes an input-derived value to
          # $GITHUB_OUTPUT, and the dispatch input is free text that the REST API
          # will happily accept newlines in. A newline turns the write below into
          # multiple key=value lines, a second `ref=` line wins, and the deploy
          # checks out whatever was appended while the run's inputs still show the
          # innocuous value — the guard defeated, with a misleading audit trail.
          #
          # Anchors must bind the whole string, so this uses bash [[ =~ ]] rather
          # than grep: grep is line-oriented and would match a payload's first line
          # and report success for the whole thing.
          #
          # $REF is deliberately not echoed here — it has not been vetted yet, and
          # stdout is parsed for ::workflow commands::.
          if [[ ! "$REF" =~ ^[A-Za-z0-9._/-]+$ ]]; then
            echo "::error::Refusing the dispatch ref: it must be a single line of [A-Za-z0-9._/-] characters. Pass a release-* tag or a full 40-character commit SHA."
            exit 1
          fi

          # Strip a fully-qualified tag prefix so refs/tags/release-X is treated the
          # same as release-X — it names the identical tag and is just as immutable.
          # Only refs/tags/ is stripped: refs/heads/release-X must stay rejected, and
          # does, because after no stripping it no longer starts with "release-".
          ref="${REF#refs/tags/}"

          if [[ "$ref" =~ ^release-[A-Za-z0-9._/-]+$ ]]; then
            # git's own refname grammar catches what a character class cannot: "..",
            # "@{", a trailing ".lock", a leading or trailing dot, an empty path
            # component. No repository required — this is a pure syntax check.
            if ! git check-ref-format "refs/tags/$ref"; then
              echo "::error::Refusing to deploy '$REF': not a valid git tag name."
              exit 1
            fi
            # Emit the tag fully qualified rather than echoing the input back. A bare
            # release-X is ambiguous if a *branch* of that name also exists, and a
            # textual check cannot tell them apart — refs/tags/release-X can only
            # resolve to the tag, and fails outright if no such tag exists.
            echo "ref=refs/tags/$ref" >> "$GITHUB_OUTPUT"
          # Hex is matched case-insensitively; git resolves an uppercase SHA to the
          # same commit, so rejecting it would be a surprise with no safety value.
          elif [[ "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "ref=$ref" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Refusing to deploy '$REF' to production: it is neither a release-* tag (bare or refs/tags/-qualified) nor a full 40-character commit SHA. Branches and abbreviated SHAs can move or become ambiguous, so the deployed revision would not be reproducible. Cut a release-* tag, or pass the full commit SHA."
            exit 1
          fi
          echo "accepted '$REF'"

  deploy:
    needs: validate-ref
    # validate-ref is skipped on a tag push, and a skipped dependency would skip this
    # job too under the default `success()` gate. Gate on "nothing failed" instead, so
    # tag pushes proceed while a rejected dispatch ref still stops the deploy.
    if: ${{ !failure() && !cancelled() }}
    uses: ./.github/workflows/deploy-native.yml
    with:
      environment: production
      # The production host is on a private network (RFC1918 v4), so no
      # GitHub-hosted runner can reach it. dind-small is an org-wide ARC pool whose
      # pods can: staging deploys over its private address from this same pool. The
      # pool's arch is irrelevant — ship only runs ssh/tar, never the binary.
      #
      # It is a bare name, not a label list. An ARC runner scale set is selected by
      # its name alone and carries none of the default self-hosted/linux/x64 labels
      # that classic runners get, so a list like ["self-hosted","linux","imcp-prod"]
      # matches nothing here no matter what labels are added to the pool — an earlier
      # revision of this file used exactly that and could never have deployed.
      #
      # Note this puts the production SSH key on shared multi-tenant pods. Accepted
      # for now; a dedicated scale set is the way to isolate it later.
      ship_runs_on: '"dind-small"'
      # arm64, matching staging. Parity matters here: aws-lc-sys/ring carry
      # per-arch assembly, so a differing production arch would leave the crypto
      # paths this server's auth depends on unexercised by staging.
      arch: arm64
      build_runs_on: '"ubuntu-24.04-arm"'
      # Take validate-ref's normalized output, not inputs.ref — that is what makes the
      # checkout unambiguous rather than merely making the input look acceptable. On a
      # tag push validate-ref is skipped, so the output is empty and github.ref (already
      # refs/tags/release-*) is used.
      ref: ${{ needs.validate-ref.outputs.ref || github.ref }}
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
      DEPLOY_DOMAIN: ${{ secrets.PROD_DEPLOY_DOMAIN }}
      DEPLOY_ACME_EMAIL: ${{ secrets.PROD_DEPLOY_ACME_EMAIL }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.PROD_DEPLOY_KNOWN_HOSTS }}
