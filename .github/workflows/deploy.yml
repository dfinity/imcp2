# Auto-redeploy imcp2 to staging on every push to main.
#
# Staging tracks main continuously so changes get exercised on a real host before a
# release is cut. Production is a separate host that only moves on a `release-*`
# tag — see deploy-release.yml. Both share the mechanics in deploy-native.yml, which
# cross-builds the binary and ships it + static/ over SSH to systemd services. See
# deploy/native/README.md for the deploy model.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_SSH_KEY    private SSH key (PEM/OpenSSH) for a sudo-capable user on the host
#   DEPLOY_HOST       user@host (matches deploy.sh's HOST). Must be an address the
#                     ship runner can actually reach — see the ship_runs_on comment
#                     below, which is what decides whether that is the host's private
#                     address or its public one.
#   DEPLOY_DOMAIN     public FQDN served over HTTPS, e.g. mcp.example.com
#   DEPLOY_ACME_EMAIL email for Let's Encrypt / ACME
# Optional:
#   DEPLOY_KNOWN_HOSTS  host public keys (output of `ssh-keyscan <host>`). If unset,
#                       the host key is fetched at run time via ssh-keyscan (TOFU).
name: Deploy main

on:
  push:
    branches: [main]
  # Allow manually re-running the deploy from the Actions tab.
  workflow_dispatch:

# Never run two deploys at once; let an in-flight deploy finish rather than cancel it.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-native.yml
    with:
      environment: staging
      # A bare scale-set name, not a label list. `["self-hosted","linux"]` matched
      # nothing and left the first post-#84 deploy queued indefinitely: the org's
      # self-hosted capacity is ARC-managed pools, and a runner scale set is selected
      # by its name alone, carrying none of the default labels classic runners get.
      #
      # dind-small is one of those org-wide, Kubernetes-backed pools. Its pods can
      # reach this host on its private address over the VPN — confirmed by a deploy
      # that shipped and passed the /version assertion from one — which is what makes
      # the private-network target workable without exposing SSH to the internet.
      #
      # The pool spans more than one cluster and a pod can land on either, so the
      # source address the host sees is not fixed. DEPLOY_HOST must name the host's
      # private address for any of this to hold; see deploy-native.yml's description
      # of that secret.
      ship_runs_on: '"dind-small"'
      # Staging host is arm64 (Graviton).
      arch: arm64
      build_runs_on: '"ubuntu-24.04-arm"'
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
      DEPLOY_ACME_EMAIL: ${{ secrets.DEPLOY_ACME_EMAIL }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      # Submission-specific, not host-specific: the same repository-level
      # secret feeds staging and production (see deploy-native.yml).
      OPENAI_APPS_CHALLENGE_TOKEN: ${{ secrets.OPENAI_APPS_CHALLENGE_TOKEN }}
