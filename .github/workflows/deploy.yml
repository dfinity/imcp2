# Auto-redeploy imcp2 to staging on every push to main.
#
# Staging tracks main continuously so changes get exercised on a real host before a
# release is cut. Production is a separate host that only moves on a `release-*`
# tag — see deploy-release.yml. Both share the mechanics in deploy-native.yml, which
# cross-builds the binary and ships it + static/ over SSH to systemd services. See
# deploy/native/README.md for the deploy model.
#
# Required repository secrets (Settings -> Secrets and variables -> Actions):
#   DEPLOY_SSH_KEY    private SSH key (PEM/OpenSSH) for a sudo-capable user on the host
#   DEPLOY_HOST       user@host (matches deploy.sh's HOST). Must be an address the
#                     ship runner can actually reach — see the ship_runs_on comment
#                     below, which is what decides whether that is the host's private
#                     address or its public one.
#   DEPLOY_DOMAIN     public FQDN served over HTTPS, e.g. mcp.example.com
#   DEPLOY_ACME_EMAIL email for Let's Encrypt / ACME
# Optional:
#   DEPLOY_KNOWN_HOSTS  host public keys (output of `ssh-keyscan <host>`). If unset,
#                       the host key is fetched at run time via ssh-keyscan (TOFU).
name: Deploy main

on:
  push:
    branches: [main]
  # Allow manually re-running the deploy from the Actions tab.
  workflow_dispatch:

# Never run two deploys at once; let an in-flight deploy finish rather than cancel it.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  deploy:
    uses: ./.github/workflows/deploy-native.yml
    with:
      environment: staging
      # `["self-hosted","linux"]` never matched anything: the org's self-hosted
      # capacity is ARC-managed pools, and a runner scale set is selected by its name
      # alone — it does not carry the default self-hosted/linux labels that classic
      # runners get. The first deploy after that landed sat queued indefinitely.
      #
      # dind-small is one of those org-wide pools (Kubernetes, dfinity-ops/k8s, on the
      # dm1-idx1 / zh1-idx1 clusters). Whether its pods can route to this host's
      # RFC1918 address is UNCONFIRMED — that is what this is testing. If they cannot,
      # the ship step fails at SSH rather than hanging, which is the point: a fast,
      # legible answer instead of a queue that never drains. Should it fail, the
      # build/ship split still needs a runner inside the VPC, and the host cannot drop
      # public SSH until one exists.
      ship_runs_on: '"dind-small"'
      # Staging host is arm64 (Graviton).
      arch: arm64
      build_runs_on: '"ubuntu-24.04-arm"'
    secrets:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
      DEPLOY_ACME_EMAIL: ${{ secrets.DEPLOY_ACME_EMAIL }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
