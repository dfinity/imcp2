# Publish the crate to crates.io from a version tag.
#
# Every `v*` tag pushed to this repository publishes that exact commit to
# crates.io. Deliberately a different prefix from `release-*` (deploy-release.yml,
# which ships the production host): a library release and a production rollout are
# separate events and should not be forced to happen together.
#
# Cutting a crate release:
#   # bump `version` in Cargo.toml, land it on main, then from that commit:
#   git tag v0.1.1
#   git push origin v0.1.1
#
# The tag must match Cargo.toml's `version` exactly and must point at a commit on
# `main` — the guards below fail the run rather than publishing. There is no
# rollback: crates.io releases are permanent and a bad one can only be yanked
# (`cargo yank --version X.Y.Z`), which hides it from new dependency resolution but
# leaves it downloadable for anyone whose lockfile already pins it. The fix for a
# bad release is a new version, never a re-publish of the old one.
#
# AUTHENTICATION IS TRUSTED PUBLISHING (OIDC) — there is no crates.io token in this
# repository's secrets, and there should not be one. The publish job asks GitHub for
# a short-lived OIDC token, crates.io exchanges it for an access token good for ~30
# minutes, and the action revokes that token in its post step. A leaked repository
# secret would be a standing publish credential; this is not.
#
# One-time setup on crates.io (crate -> Settings -> Trusted Publishing -> Add):
#   Repository owner   dfinity
#   Repository name    imcp2
#   Workflow filename  publish-crate.yml   <- this file's name; renaming it breaks
#                                             publishing until the config is updated
#   Environment name   release             <- must match the `environment:` below,
#                                             or be left blank to accept any
# A trusted publisher can only be configured on a crate that already exists, so the
# FIRST release of each crate has to be published by hand — `cargo publish --locked`
# with a personal token (imcp2's 0.1.0 was; imcp2-core's first release must be, and
# its trusted publisher configured with this same repository/workflow/environment)
# — and every release after it goes through this workflow.
#
# REQUIRED REPOSITORY SETTINGS, to be in place BEFORE the trusted publisher is
# enabled. Neither can be expressed in this file, and without them the guards below
# are only mistake-guards:
#
#   * Protected tags for `v*` (Settings -> Rules -> Rulesets, target: tags). GitHub
#     loads a tag-triggered workflow FROM THE TAGGED COMMIT, so whoever can push a
#     `v*` tag can point it at an unreviewed commit carrying a doctored copy of this
#     file — one with the guards deleted. That run still satisfies the trusted
#     publisher's claims, because crates.io matches on repository, workflow filename
#     and environment, none of which name a ref. Branch protection on `main` does
#     not close this path; tag protection is what limits who can open it.
#   * Required reviewers on the `release` environment (Settings -> Environments).
#     This is the control that survives a doctored workflow: the environment gate is
#     enforced by GitHub outside the workflow file, so the run cannot proceed to the
#     credential-holding job until a human approves it.
name: Publish crate

on:
  push:
    tags: ['v*']

# Grouped per tag rather than one group for the whole workflow. A shared group
# would be the obvious way to serialize releases, but GitHub concurrency is not a
# queue: it holds at most one running and one pending run per group, and a third
# arrival evicts the pending one even with `cancel-in-progress: false`. A burst of
# tag pushes would then silently skip a version. Per tag, duplicate runs of the
# SAME version (a re-push, a re-run) still collapse, and no version can cancel
# another's release. `cancel-in-progress: false` so a publish is never killed
# half-way.
concurrency:
  group: publish-crate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything that compiles or executes project and dependency code — build
  # scripts, proc macros, the test suite — runs HERE, in a job with no `id-token`
  # permission and no crates.io credential anywhere in its environment.
  #
  # The split is the point. A job granted `id-token: write` exposes
  # ACTIONS_ID_TOKEN_REQUEST_URL/TOKEN to every process in it, so a build script
  # anywhere in the locked dependency tree could mint its own crates.io-audience
  # OIDC token, exchange it for a publish token, and keep it — the auth action's
  # post step revokes only the token it fetched itself. Running the compile in a
  # separate job means no dependency code ever executes within reach of the
  # credential.
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      # Third-party actions are pinned to a commit SHA (supply-chain hardening);
      # the trailing comment records the human-readable version.
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Full history: the ancestry check below needs the commits between this
          # tag and main, which the default shallow clone does not fetch.
          fetch-depth: 0

      # Use the runner's pre-installed rustup to pull a current stable toolchain,
      # avoiding an extra (unpinned) third-party action. Same as ci.yml.
      - name: Install stable Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustc --version && cargo --version

      # A tag that disagrees with the manifests publishes a version under a name
      # nobody can check out — and crates.io cannot take it back. Read the versions
      # from cargo itself rather than grepping the manifests, so the check reads the
      # same field `cargo publish` will. Both workspace crates release in lockstep:
      # one tag, one version, two packages (imcp2 depends on imcp2-core "=version"
      # semantics via the workspace pin, so a skew would not resolve anyway).
      - name: Check the tag matches both Cargo.toml versions
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for pkg in imcp2-core imcp2; do
            manifest="$(cargo metadata --format-version 1 --no-deps |
              jq -er --arg pkg "$pkg" '.packages[] | select(.name == $pkg) | .version')"
            echo "tag=$tag $pkg=$manifest"
            if [ "$tag" != "$manifest" ]; then
              echo "::error::tag ${GITHUB_REF_NAME} does not match ${pkg}'s Cargo.toml version ${manifest}" >&2
              exit 1
            fi
          done

      # A tag can name any commit in the repository, including one that never went
      # through review. This catches the mistake — tagging a topic branch, or a
      # commit that was rebased away — and nothing more: a tag-triggered workflow is
      # read from the tagged commit, so a deliberately doctored copy of this file
      # would simply not contain this step. Protected `v*` tags and a reviewed
      # `release` environment are what make that case hard; see the header.
      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main" >&2
            exit 1
          fi

      # ci.yml runs on pull requests and on pushes to main; a tag can point at any
      # commit, so re-run the suite against the exact revision about to become an
      # immutable public release. `--locked` also guards Cargo.lock from drift, and
      # the lockfile is what ships in the .crate.
      - name: Test
        run: cargo test --locked --workspace --all-targets

      # Rehearses the real thing — packages each crate, and compiles imcp2-core's
      # package in isolation — but stops short of uploading, so a package that only
      # builds because of something untracked in the working tree fails here rather
      # than after the upload is already permanent. imcp2's package cannot be
      # compile-verified before this release's imcp2-core exists on crates.io (it
      # depends on it by version), so its rehearsal is `cargo package` without the
      # verify build: the workspace test above already compiled exactly these
      # sources. This is also the verify work that lets the publish job skip its
      # own; see `--no-verify` below.
      - name: Package
        run: |
          cargo publish --locked --dry-run -p imcp2-core
          cargo package --locked --no-verify -p imcp2

  # Holds the credential, and compiles nothing.
  publish:
    needs: verify
    runs-on: ubuntu-24.04
    # Names the deployment target for the OIDC token's `environment` claim, which
    # crates.io checks against the trusted-publisher configuration. It is also the
    # hook for required reviewers (see the header): a protection rule here gates the
    # only job that can reach crates.io, and does so from outside the workflow file.
    environment: release
    permissions:
      # Lets the job mint the OIDC token that stands in for a crates.io API token.
      # This is the whole point of the workflow; without it the auth step 403s.
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install stable Rust toolchain
        run: |
          rustup update --no-self-update stable
          rustup default stable
          rustc --version && cargo --version

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      # `--no-verify` is deliberate and is the second half of the job split. Without
      # it `cargo publish` compiles the package — running the dependency tree's build
      # scripts and proc macros — while CARGO_REGISTRY_TOKEN sits in their
      # environment. The verify build is not skipped, only moved: the `verify` job
      # packaged both crates (and compiled imcp2-core's package) over this same
      # commit, and the workspace test suite compiled exactly these sources. What
      # remains in this job is reading files into a .crate and an HTTPS upload.
      #
      # Order matters: imcp2 depends on imcp2-core by version, so core publishes
      # first; `cargo publish` waits for the just-published crate to appear in the
      # index before returning, so the second publish resolves the first.
      - name: Publish imcp2-core
        run: cargo publish --locked --no-verify -p imcp2-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Publish imcp2
        run: cargo publish --locked --no-verify -p imcp2
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
