[package]
name = "imcp2-core"
version = "0.4.0"
edition = "2021"
description = "Transport-agnostic components of the IMCP2 Internet Computer MCP server: the tool surface, the Internet Identity session engine, and the II connect-handshake primitives."
license = "Apache-2.0"
repository = "https://github.com/dfinity/imcp2"
homepage = "https://mcp.internetcomputer.org"
keywords = ["mcp", "internet-computer", "icp", "candid"]
categories = ["network-programming", "api-bindings"]

[dependencies]
# No transport feature: each binary picks its own (streamable-HTTP in imcp2,
# stdio in imcp2-local). `server` + `macros` carry the tool router, the
# ServerHandler machinery, and the schemars re-export every tool schema
# derives against.
rmcp = { workspace = true, features = ["server", "macros"] }
ic-agent = { workspace = true }
candid = { workspace = true }
candid_parser = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "net", "time"] }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
sha2 = { workspace = true }
base64 = { workspace = true }
hex = { workspace = true }
crc32fast = { workspace = true }
regex = { workspace = true }
reqwest = { workspace = true }
getrandom = { workspace = true }
urlencoding = { workspace = true }
url = { workspace = true }
# Only for the end-to-end canister-tool tests (src/e2e_canister_tools.rs),
# behind the `e2e` feature so the default build compiles neither. `pocket-ic`
# runs a real replica locally (needs the POCKET_IC_BIN server binary at
# runtime); `wat` assembles the small test canister those tests install, so no
# wasm toolchain — and no checked-in binary — is needed to build one.
pocket-ic = { version = "15", optional = true }
wat = { version = "1", optional = true }

[features]
# Compiles + enables the end-to-end tests that drive the canister tools over a
# real MCP session against real canisters in PocketIC (see
# `src/e2e_canister_tools.rs` for the run command). Off by default: the standard
# `cargo test` neither builds `pocket-ic` nor starts a replica. The two test
# seams the tests need — `discover::webfixture` and
# `Identities::seed_app_identity` — are gated on `cfg(test)` as well, so they
# exist only in this crate's own test binary, never in a library build.
e2e = ["dep:pocket-ic", "dep:wat", "rmcp/client"]
